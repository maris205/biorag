kb:
  root: /autodl-fs/data/open-rosalind-kb/standard
  raw_dir: /autodl-fs/data/open-rosalind-kb/standard/raw
  index_dir: /root/autodl-tmp/dnarag/data/heldout
  sqlite_path: /autodl-fs/data/open-rosalind-kb/standard/index/open_rosalind_standard.sqlite
  manifest_path: /autodl-fs/data/open-rosalind-kb/standard/index/manifest.json
  blast_db: /root/autodl-tmp/dnarag/data/heldout/blast/protein_parent_frag_500_controlled20k_index
  blast_fasta: /root/autodl-tmp/dnarag/data/heldout/protein_parent_frag_500_controlled20k_index.fasta
  blastn_db: /root/autodl-tmp/dnarag/data/heldout/blast/dna_parent_frag_100_controlled20k_index
  blastn_fasta: /root/autodl-tmp/dnarag/data/heldout/dna_parent_frag_100_controlled20k_index.fasta
  graph_dir: indexes/heldout_dna_parent_frag_100_controlled20k_omnigene_4bit_mean/graph
  vector_dir: indexes/heldout_dna_parent_frag_100_controlled20k_omnigene_4bit_mean/vector

embedding:
  model: dnagpt/OmniGene-4-CPT-v2-4bit
  pooling: mean
  dtype: bf16
  batch_size: 1

retrieval:
  local_first: true
  fallback_public_api: false
  default_modes:
    - blast
    - vector
