kb:
  root: /autodl-fs/data/open-rosalind-kb/standard
  raw_dir: /autodl-fs/data/open-rosalind-kb/standard/raw
  index_dir: /autodl-fs/data/open-rosalind-kb/standard/index
  sqlite_path: /autodl-fs/data/open-rosalind-kb/standard/index/open_rosalind_standard.sqlite
  manifest_path: /autodl-fs/data/open-rosalind-kb/standard/index/manifest.json
  blast_db: /autodl-fs/data/open-rosalind-kb/standard/index/blast/swissprot
  blast_fasta: /autodl-fs/data/open-rosalind-kb/standard/index/blast/swissprot.fasta
  blastn_db: /autodl-fs/data/open-rosalind-kb/standard/index/blast/ensembl_cdna
  blastn_fasta: /autodl-fs/data/open-rosalind-kb/standard/index/blast/ensembl_cdna.fasta
  graph_dir: indexes/standard/graph
  vector_dir: indexes/standard/vector

embedding:
  model: dnagpt/OmniGene-4-CPT-v2-4bit
  pooling: mean
  dtype: auto
  batch_size: 1

retrieval:
  local_first: true
  fallback_public_api: false
  default_modes:
    - fts
    - blast
    - graph
    - vector
